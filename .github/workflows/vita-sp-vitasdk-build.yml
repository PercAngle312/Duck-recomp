name: Compile Vita game graphics runtime with pinned VitaSDK
on:
  workflow_dispatch:
  push:
    branches: [vita/arm32-bringup]
    paths:
      - 'vita/src/sp*.c'
      - 'vita/src/os_sp.c'
      - 'vita/src/game_loop.c'
      - 'vita/src/live.c'
      - 'vita/include/duck_vita_live.h'
      - 'vita/include/duck_vita_sp*.h'
      - 'vita/include/duck_vita_game_loop.h'
      - '.github/workflows/vita-sp-vitasdk-build.yml'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned VitaSDK
        run: |
          mkdir -p /tmp/duck-sdk
          curl -fL --retry 3 "https://github.com/vitasdk/autobuilds/releases/download/sdk-snapshot-20261015.850.1/vitasdk-x86_64-linux-gnu-2026-10-15_05-01-16.tar.bz2" -o /tmp/duck-sdk/sdk.tar.bz2
          echo "801f483928523fe63547faf58a7dfdaca7482b26c33af0064acea96a906f7662  /tmp/duck-sdk/sdk.tar.bz2" | sha256sum -c -
          mkdir -p /tmp/duck-sdk/root
          tar -xjf /tmp/duck-sdk/sdk.tar.bz2 -C /tmp/duck-sdk/root
      - name: Get pinned N64Recomp ABI
        run: |
          mkdir -p /tmp/duck-abi
          curl -fL --retry 3 https://raw.githubusercontent.com/N64Recomp/N64Recomp/ffb39cdad1da5de07eaaa48bd1db4a89a7986771/include/recomp.h -o /tmp/duck-abi/recomp.h
          cp vita/include/portable_mul.h /tmp/duck-abi/portable_mul.h
          python3 vita/patch_arm_recomp.py --header /tmp/duck-abi/recomp.h --portable-header /tmp/duck-abi/portable_mul.h
      - name: Cross-compile production scheduler and graphics runtime
        run: |
          set -eu
          SDK_CC="$(find /tmp/duck-sdk/root -type f -name arm-vita-eabi-gcc -print -quit)"
          test -n "$SDK_CC"
          mkdir -p /tmp/duck-objects
          export VITASDK="$(dirname "$(dirname "$SDK_CC")")"
          echo "VitaSDK root: $VITASDK"
          "$SDK_CC" --version
          for file in live sp sp_events sp_runtime os_sp game_loop dispatch recomp_bridge scheduler queue os_io os_queue os_core os_threads os_interrupt fiber_vita os_time os_vi os_vi_config; do
            echo "::group::Compile $file.c"
            "$SDK_CC" -std=c11 -O1 -Wall -Wextra -mcpu=cortex-a9 -mfpu=neon -mfloat-abi=hard -Ivita/include -I/tmp/duck-abi -c "vita/src/$file.c" -o "/tmp/duck-objects/$file.o"
            echo "::endgroup::"
          done
          test "$(find /tmp/duck-objects -name '*.o' | wc -l)" -eq 19
      - name: Relocatable ARM link of scheduler and graphics components
        run: |
          set -eu
          SDK_BIN="$(dirname "$(find /tmp/duck-sdk/root -type f -name arm-vita-eabi-gcc -print -quit)")"
          "$SDK_BIN/arm-vita-eabi-gcc" -r /tmp/duck-objects/sp.o /tmp/duck-objects/sp_events.o /tmp/duck-objects/sp_runtime.o /tmp/duck-objects/os_sp.o /tmp/duck-objects/game_loop.o /tmp/duck-objects/live.o /tmp/duck-objects/dispatch.o /tmp/duck-objects/recomp_bridge.o /tmp/duck-objects/scheduler.o /tmp/duck-objects/queue.o /tmp/duck-objects/os_io.o /tmp/duck-objects/os_queue.o /tmp/duck-objects/os_core.o /tmp/duck-objects/os_threads.o /tmp/duck-objects/os_interrupt.o /tmp/duck-objects/fiber_vita.o /tmp/duck-objects/os_time.o /tmp/duck-objects/os_vi.o /tmp/duck-objects/os_vi_config.o -o /tmp/duck-objects/duck-vita-graphics-runtime-linked.o
          "$SDK_BIN/arm-vita-eabi-nm" -u /tmp/duck-objects/duck-vita-graphics-runtime-linked.o | tee /tmp/duck-objects/unresolved-runtime.txt
          file /tmp/duck-objects/duck-vita-graphics-runtime-linked.o
          "$SDK_BIN/arm-vita-eabi-nm" /tmp/duck-objects/duck-vita-graphics-runtime-linked.o | grep -q " T duck_vita_live_run"
          echo "Relocatable ARM link only: unresolved production external functions remain and this is NOT a Vita ELF/VPK."
      - name: Link runtime against VitaSDK libc
        run: |
          set -eu
          SDK_CC="$(find /tmp/duck-sdk/root -type f -name arm-vita-eabi-gcc -print -quit)"
          cat > /tmp/duck-objects/runtime-entry.c <<'EOF'
          /* Link-only entry: never presented as a playable game. */
          int main(void) { return 0; }
          EOF
          "$SDK_CC" -std=c11 -c /tmp/duck-objects/runtime-entry.c -o /tmp/duck-objects/runtime-entry.o
          "$SDK_CC" -Wl,--no-gc-sections /tmp/duck-objects/runtime-entry.o /tmp/duck-objects/duck-vita-graphics-runtime-linked.o -lSceFiber_stub -lSceSysmodule_stub -lm -o /tmp/duck-objects/duck-vita-runtime-link.elf
          "$(dirname "$SDK_CC")/arm-vita-eabi-nm" -u /tmp/duck-objects/duck-vita-runtime-link.elf | tee /tmp/duck-objects/final-undefined.txt
          if grep -Eq '^[[:space:]]*U[[:space:]]' /tmp/duck-objects/final-undefined.txt; then
            echo "Unresolved strong symbols in ELF"; exit 1
          fi
          file /tmp/duck-objects/duck-vita-runtime-link.elf
          echo "Linked runtime-only ELF, no game assets or translated gameplay."
      - name: Check private final-link script syntax
        run: python3 -m py_compile vita/link_private_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: duck-vita-sp-arm-objects
          path: /tmp/duck-objects/*.o
