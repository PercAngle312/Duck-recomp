name: Windows native SDK baseline
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-alias:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify MSVC and Windows SDK, compile test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /D_WIN32_WINNT=0x0A00 tests\windows_alias_smoke.cpp /link onecore.lib /OUT:alias_test.exe
      - name: Run Windows RAM alias test
        shell: pwsh
        run: |
          & .\alias_test.exe *>&1 | Tee-Object -FilePath alias-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload result and executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-sdk-memory-baseline
          path: |
            alias_test.exe
            alias-test.log
          if-no-files-found: warn
