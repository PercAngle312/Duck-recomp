name: Vita framebuffer contract
on:
  push:
    branches: [vita/arm32-bringup]
    paths:
      - 'vita/include/duck_vita_framebuffer.h'
      - 'vita/src/framebuffer_convert.c'
      - 'vita/tests/framebuffer.c'
      - 'vita/include/duck_vita_guest_memory.h'
      - 'vita/src/guest_memory.c'
      - 'vita/tests/guest_memory.c'
      - 'vita/include/duck_vita_bus.h'
      - 'vita/src/bus.c'
      - 'vita/tests/bus.c'
      - 'vita/include/duck_vita_dma.h'
      - 'vita/src/dma.c'
      - 'vita/tests/dma.c'
      - '.github/workflows/vita-framebuffer.yml'
  pull_request:
    paths:
      - 'vita/include/duck_vita_framebuffer.h'
      - 'vita/src/framebuffer_convert.c'
      - 'vita/tests/framebuffer.c'
      - '.github/workflows/vita-framebuffer.yml'
jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native-pixel contract test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I vita/include vita/src/framebuffer_convert.c vita/tests/framebuffer.c -o /tmp/duck-vita-framebuffer
      - name: Test scaled and bounded pixels
        run: /tmp/duck-vita-framebuffer
      - name: Compile guest memory contract
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I vita/include vita/src/guest_memory.c vita/tests/guest_memory.c -o /tmp/duck-vita-guest-memory
      - name: Test guest memory boundaries
        run: /tmp/duck-vita-guest-memory
      - name: Compile memory bus contract
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I vita/include vita/src/guest_memory.c vita/src/bus.c vita/tests/bus.c -o /tmp/duck-vita-bus
      - name: Test device dispatch isolation
        run: /tmp/duck-vita-bus
      - name: Compile ROM DMA contract
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I vita/include vita/src/guest_memory.c vita/src/dma.c vita/tests/dma.c -o /tmp/duck-vita-dma
      - name: Test bounded cartridge transfers
        run: /tmp/duck-vita-dma
